<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nothing leaves the page: no requests of any kind, only its own inline script and style. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<title>Pahlavan gym</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2a2620;--muted:#6f665b;--line:#e4ddd0;--ok-bg:#e3f1e8;--ok:#2f6b4a;--acc:#1f5f78;--acc-bg:#e2eef3;--btn:#1f5f78;--on:#fff;--warn:#7d520f;--warn-bg:#f6ead3;--field:#fff;--shadow:0 4px 16px rgba(42,38,32,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#252220;--ink:#ece6dc;--muted:#a39a8d;--line:#3a3531;--ok-bg:#1f3a2b;--ok:#8fd1aa;--acc:#9cc9da;--acc-bg:#1d3440;--btn:#3d8aa8;--on:#0d1a20;--warn:#e7c27d;--warn-bg:#3a2f1c;--field:#1d1b19;--shadow:0 4px 16px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
main{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.load{margin:22vh 4px 0;text-align:center}
.load .lead{margin:0 0 18px;font-size:17px;color:var(--muted)}
.load .hint{margin:10px 0 0}
.load-msg{margin:14px 0 0;color:var(--warn);font-size:15px}
.load-msg:empty{display:none}
.load .paste{margin:16px 0 0;text-align:left}
.load .link{display:block;margin:22px auto 0}
.muted{color:var(--muted)}
.top{padding:2px 2px 14px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:22px;font-weight:650;margin:0;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.count{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:14px;margin-top:2px}
.switch{display:flex;gap:8px;margin-top:12px}
.pick-wrap{position:relative;flex:1;min-width:0}
.pick-wrap::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pick{width:100%;min-height:44px;padding:0 38px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;-webkit-appearance:none;appearance:none;text-overflow:ellipsis}
.chip{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:15px}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 8px;margin:0 0 12px}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-head h2{flex:1;min-width:0;font-size:17px;font-weight:620;margin:0;line-height:1.3;overflow-wrap:anywhere}
.tag{flex:none;margin-top:2px;font-size:12px;line-height:1;padding:5px 8px;border-radius:10px;background:var(--acc-bg);color:var(--acc)}
/* 44 px to tap, centred on the name's first line, without making the head taller. */
.link{flex:none;min-height:44px;min-width:44px;margin:-10px -8px -10px 0;padding:0 8px;border:0;background:none;color:var(--acc);font-size:15px}
.swap{color:var(--acc);font-size:14px;margin:2px 0 0}
.sub{color:var(--muted);font-size:14px;margin:3px 0 2px}
.note{color:var(--muted);font-size:14px;font-style:italic;margin:2px 0}
.part h3{font-size:15px;font-weight:600;margin:10px 0 0}
.part h3 .muted{font-weight:400;font-size:14px}
.set{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-top:1px solid var(--line)}
.sub+.set,.note+.set,.card-head+.set,h3+.set,.swap+.set{border-top:0}
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tick.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-size:19px}
.val{flex:1;min-width:0;font-size:17px;font-variant-numeric:tabular-nums}
.set.on .val{color:var(--ok)}
.rir{color:var(--muted);font-size:14px}
.edit{flex:none;min-height:44px;min-width:48px;margin-right:-8px;padding:0 8px;border:0;background:none;color:var(--acc);font-size:15px}
.editor{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.field>span{color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:22px;line-height:1}
.num{width:84px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.num:focus,.pick:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.close{justify-self:end;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--acc);font-size:15px}
.mins{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.mins .num{width:64px}
.card.skipped{background:transparent}
.card.skipped h2{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 8px}
.chips .chip{background:var(--card)}
.chips .chip.on{background:var(--acc-bg)}
.pain{margin:0 0 8px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.end{padding:8px 14px 14px}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.notes{display:grid;gap:6px}
.notes>span{color:var(--muted);font-size:15px}
textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-size:16px;resize:vertical}
.send{display:block;width:100%;min-height:54px;margin:4px 0 0;border:0;border-radius:14px;background:var(--btn);color:var(--on);font-size:17px;font-weight:600}
.send.sent{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.rest{position:fixed;z-index:5;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));max-width:456px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:4px 4px 4px 16px;border-radius:14px;background:var(--acc-bg);color:var(--acc);box-shadow:var(--shadow);font-size:15px}
.rest::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.rest .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest b{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.rest .x{flex:none;width:44px;height:44px;border:0;border-radius:10px;background:none;color:inherit;font-size:24px;line-height:1}
.rest.over{background:var(--ok-bg);color:var(--ok)}
</style>
</head>
<body>
<main id="gym"><noscript><p class="empty">This page needs JavaScript.</p></noscript></main>
<!--gym-script-->
</body>
</html>
